steps:
  # Step 1: Install dependencies, inject secret ke .env.production, lalu build
  - name: 'node:20'
    entrypoint: bash
    args:
      - '-c'
      - |
        echo "VITE_MARKETPLACE_API_BASE_URL=$$SECRET_API_URL" > .env.production
        npm ci
        npm run build
    secretEnv:
      - 'SECRET_API_URL'

  # Step 2: Deploy static build ke App Engine
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'app'
      - 'deploy'
      - 'app.yaml'
      - '--quiet'

# Mapping secret dari Secret Manager ke environment variable di Cloud Build
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/VITE_MARKETPLACE_API_BASE_URL/versions/latest
      env: 'SECRET_API_URL'

options:
  logging: CLOUD_LOGGING_ONLY